name: Argent QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Node
        uses: actions/setup-node@49933ea5288ca35ae1d3a6413432763f4828f9e8 # v4
        with:
          node-version: 22

      - name: Install Electron system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"

      - name: Vendor the Electron shell
        run: npm ci
        working-directory: .argent/electron

      - name: Install Argent
        run: npm install -g @swmansion/argent

      - name: Start the site
        run: |
          bun dev-server.ts 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          echo 'dev-server did not become ready'
          exit 1

      - name: Run Argent QA flows
        env:
          ARGENT_ELECTRON_SWIFTSHADER: '1'
          SITE_URL: http://127.0.0.1:8765/
        run: |
          mkdir -p artifacts
          argent flow run .argent/flows --platform chromium --output artifacts

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: warn
          name: argent-qa
          path: artifacts/
