name: Argent QA

# The deterministic flows in .argent/flows are the merge gate. This job runs
# them in the Electron shell under SwiftShader and posts one per-flow table on
# the pull request (comment marker <!-- argent-qa -->), updated in place on
# every push. Pushes to main run the flows and keep the artifacts but post
# nothing. The job runs once per supported Node major (22 and 24); only the
# Node 24 leg posts the comment. See .argent/qa.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Generate candidate visual baselines for human review (not a regression pass)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: argent-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Boot the Argent shell and the site
        uses: ./.github/actions/argent-shell
        with:
          node-version: ${{ matrix.node }}

      - name: Run Argent QA flows
        id: flows
        env:
          UPDATE_BASELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        run: |
          mkdir -p artifacts
          options=()
          if [ "$UPDATE_BASELINES" = 'true' ]; then
            options+=(--update-baselines)
            echo 'Baseline generation only; this run is not a visual regression pass.' >> "$GITHUB_STEP_SUMMARY"
          fi
          set +e
          argent flow run .argent/flows --platform chromium --output artifacts --json "${options[@]}" > artifacts/flows.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "argent flow run exited with $status"

      - name: Write the report
        if: always() && steps.flows.outcome != 'skipped'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bun tools/flow-report.ts artifacts/flows.json \
            --sha "$HEAD_SHA" --run-url "$RUN_URL" --artifacts artifacts \
            --platform "chromium (Electron, SwiftShader, Node ${{ matrix.node }})" > artifacts/flows.md
          cat artifacts/flows.md
          cat artifacts/flows.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the report on the pull request
        # Same-repo pull requests only. A fork's token is read-only, and a
        # push to main has no pull request to comment on. One leg posts so
        # the two legs do not race for the same comment.
        if: >-
          always() && steps.flows.outcome != 'skipped'
          && matrix.node == 24
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/upsert-pr-comment.sh '<!-- argent-qa -->' artifacts/flows.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: argent-qa-node${{ matrix.node }}
          path: artifacts/

      - name: Upload candidate visual baselines
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.update_baselines
          && steps.flows.outputs.status == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: argent-baselines-node${{ matrix.node }}
          path: .argent/flows/__baselines__/
          include-hidden-files: true

      - name: Fail the job if any flow failed
        if: steps.flows.outputs.status != '0'
        run: |
          echo "argent flow run exited with ${{ steps.flows.outputs.status }}; see the report above"
          exit 1
