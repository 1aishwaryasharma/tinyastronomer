steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Scale Walk.
  - await:
      timeout: 10000
      visible:
        id: launch-scale-walk
  - tap:
      id: launch-scale-walk
  - await:
      timeout: 20000
      visible:
        id: scale-walk-header
  - await:
      idle: true
  - await:
      hidden:
        id: launch-title
      timeout: 10000
