steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Seasons.
  - tap:
      id: launch-seasons
  - await:
      timeout: 20000
      visible:
        id: seasons-header
  - await:
      idle: true
  - echo: Seasons rail is built by the scene script. Expect four stops in order.
  - assert:
      text:
        in:
          id: picker
        matches: 'March equinox[\s\S]*June solstice[\s\S]*Sept equinox[\s\S]*December solstice'
  - assert:
      visible:
        id: scene-nav-btn
  - await:
      hidden:
        id: launch-title
      timeout: 10000
