steps:
  - echo: Electron shell loaded the launch deck. Expect launch-title.
  - launch:
      chromium:
        args:
          - --no-sandbox
        path: ../electron
  - await:
      timeout: 15000
      visible:
        id: launch-title
  - await:
      idle: true
  - echo: On launch deck. Open Seasons.
  - tap:
      id: launch-seasons
  - await:
      timeout: 20000
      visible:
        id: seasons-header
  - await:
      idle: true
  - await:
      hidden:
        id: launch-title
      timeout: 10000
