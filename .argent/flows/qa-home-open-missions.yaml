steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Missions.
  - await:
      timeout: 10000
      visible:
        id: launch-missions
  - tap:
      id: launch-missions
  - await:
      timeout: 20000
      visible:
        id: missions-header
  - await:
      idle: true
  - await:
      hidden:
        id: launch-title
      timeout: 10000
