steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Light Study.
  - tap:
      id: launch-light-study
  - await:
      timeout: 20000
      visible:
        id: light-study-header
  - await:
      idle: true
  - await:
      timeout: 15000
      visible:
        id: play-btn
  - await:
      hidden:
        id: launch-title
      timeout: 10000
