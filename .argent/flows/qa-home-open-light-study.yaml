steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Light Study.
  - await:
      timeout: 10000
      visible:
        id: launch-light-study
  - tap:
      id: launch-light-study
  - await:
      timeout: 20000
      visible:
        id: light-study-header
  - await:
      idle: true
  - await:
      timeout: 15000
      visible:
        id: play-btn
  - await:
      timeout: 10000
      visible:
        id: save-view-btn
  - echo: Light Study scene is running. Expect the free preset title and the Explore button.
  - assert:
      text:
        in:
          id: info-title
        equals: A world half-lit
  - assert:
      visible:
        id: scene-nav-btn
  - await:
      hidden:
        id: launch-title
      timeout: 10000
  - snapshot:
      name: light-info-panel
      cropOn:
        id: light-info-panel
  - snapshot:
      name: observation-presets
      cropOn:
        id: presets
