steps:
  - echo: Electron shell loaded the launch deck. Expect launch-title.
  - launch:
      chromium:
        args:
          - --no-sandbox
        path: ../electron
  - await:
      timeout: 15000
      visible:
        id: launch-title
  - await:
      idle: true
  - echo: On launch deck. Open Light Study.
  - tap:
      id: launch-light-study
  - await:
      timeout: 15000
      visible:
        id: light-study-header
  - await:
      idle: true
  - await:
      timeout: 15000
      visible:
        id: play-btn
  - await:
      hidden:
        id: launch-title
      timeout: 10000
