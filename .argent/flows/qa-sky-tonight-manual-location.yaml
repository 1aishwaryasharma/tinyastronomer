steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Sky Tonight and set a manual London location.
  - tap:
      id: launch-sky-tonight
  - await:
      timeout: 20000
      visible:
        id: sky-tonight-header
  - await:
      idle: true
  - await:
      timeout: 10000
      visible:
        id: use-location
  - await:
      timeout: 10000
      visible:
        id: sky-list
  - echo: On the local forecast. Open Change and enter London coordinates without
      requesting device location.
  - tap:
      text: Change
  - await:
      visible:
        id: latitude
  - type:
      into:
        id: latitude
      text: "51.5"
      submit: false
  - type:
      into:
        id: longitude
      text: "-0.1"
      submit: false
  - tap:
      id: set-location
  - await:
      timeout: 10000
      text:
        in:
          id: meta-location
        contains: 51.5°N
  - await:
      timeout: 10000
      text:
        in:
          id: location-source
        equals: Manual coordinates
  - echo: Forecast re-rendered for London. Expect the Moon phase line to be filled in.
  - assert:
      text:
        in:
          id: moon-summary
        matches: '% lit'
  - echo: The visual QA clock starts on September 8, 2026. Use Next day to select September 9 without platform-dependent date-input segments.
  - assert:
      text:
        in:
          id: meta-date
        equals: Sep 8, 2026
  - tap:
      id: date-next
  - await:
      text:
        in:
          id: meta-date
        equals: Sep 9, 2026
  - await:
      visible:
        id: night-window
  - await:
      idle: true
  - snapshot:
      name: london-night-window
      cropOn:
        id: night-window
