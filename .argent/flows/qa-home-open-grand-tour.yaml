steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Grand Tour.
  - await:
      timeout: 10000
      visible:
        id: launch-grand-tour
  - tap:
      id: launch-grand-tour
  - await:
      timeout: 20000
      visible:
        id: grand-tour-header
  - await:
      idle: true
  - await:
      hidden:
        id: launch-title
      timeout: 10000
