steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Grand Tour.
  - tap:
      id: launch-grand-tour
  - await:
      timeout: 20000
      visible:
        id: grand-tour-header
  - await:
      idle: true
  - echo: Grand Tour scene is running. Expect the overview title and the Explore button.
  - assert:
      text:
        in:
          id: info-title
        equals: Meet the neighbourhood
  - assert:
      visible:
        id: scene-nav-btn
  - await:
      hidden:
        id: launch-title
      timeout: 10000
