steps:
  - run: ../fragments/boot-electron.yaml
  - echo: On launch deck. Open Sky Tonight.
  - await:
      timeout: 10000
      visible:
        id: launch-sky-tonight
  - tap:
      id: launch-sky-tonight
  - await:
      timeout: 20000
      visible:
        id: sky-tonight-header
  - await:
      idle: true
  - await:
      hidden:
        id: launch-title
      timeout: 10000
